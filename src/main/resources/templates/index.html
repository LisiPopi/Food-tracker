<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Щоденник Харчування</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/uk.js"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/de.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="bg-layer bg-light"></div>
<div class="bg-layer bg-dark"></div>

<div class="top-bar" style="display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 15px;">

    <div style="display: flex; gap: 10px;">
        <select id="langSwitch" class="glass-btn" onchange="changeLanguage()">
            <option value="uk">🇺🇦 Укр</option><option value="en">🇬🇧 Eng</option><option value="de">🇩🇪 Deu</option>
        </select>
        <button id="themeToggle" class="glass-btn"><span id="themeIcon">🌙</span> <span data-i18n="theme">Темна тема</span></button>
    </div>

    <form th:action="@{/web/export-excel}" method="get" style="display: flex; gap: 10px; align-items: center; margin: 0;">
        <input type="hidden" name="lang" id="exportLangInput" value="uk">

        <span data-i18n="from" style="color: var(--text-color, white); font-size: 14px; font-weight: bold;">З:</span>
        <input type="text" id="startDate" name="startDate" class="glass-input" data-i18n-ph="phDate" placeholder="Оберіть..." required style="width: 110px; text-align: center;">

        <span data-i18n="to" style="color: var(--text-color, white); font-size: 14px; font-weight: bold;">До:</span>
        <input type="text" id="endDate" name="endDate" class="glass-input" data-i18n-ph="phDate" placeholder="Оберіть..." required style="width: 110px; text-align: center;">

        <button type="submit" class="glass-btn" data-i18n="exportBtn" style="background-color: #217346; color: white; white-space: nowrap; border: 1px solid #1e6b40;">
            📊 Експорт Excel
        </button>
    </form>

    <div>
        <input type="text" id="calendar" class="glass-input" th:value="${currentDate}" placeholder="Оберіть дату" style="width: 120px; text-align: center;">
    </div>
</div>

<div class="container">
    <nav class="main-nav">
        <a href="/" class="nav-link active" data-i18n="navDiary">📅 Щоденник</a>
        <a href="/ingredients" class="nav-link" data-i18n="navBase">🍎 База продуктів</a>
    </nav>

    <h1 data-i18n="title">Щоденник Харчування</h1>

    <div class="summary-board">
        <div class="summary-card">
            <h3 data-i18n="cal">Калорії</h3>
            <div class="value" id="totCal" th:text="${totalCal}">0</div>
            <div class="progress-bar"><div class="progress-fill" id="calProgress"></div></div>
            <div class="target">
                <span data-i18n="goal">Ціль</span>: <span id="goalValue">2400</span> <span data-i18n="kcalText">ккал</span>
                <button class="edit-goal-btn" onclick="editGoal()" title="Змінити ціль">✏️</button>
            </div>
        </div>
        <div class="summary-card">
            <h3 data-i18n="prot">Білки</h3>
            <div class="value" th:text="${totalProt}">0</div><div class="target" data-i18n="gramUnit">г</div>
        </div>
        <div class="summary-card">
            <h3 data-i18n="fat">Жири</h3>
            <div class="value" th:text="${totalFat}">0</div><div class="target" data-i18n="gramUnit">г</div>
        </div>
        <div class="summary-card">
            <h3 data-i18n="carbs">Вуглеводи</h3>
            <div class="value" th:text="${totalCarbs}">0</div><div class="target" data-i18n="gramUnit">г</div>
        </div>
    </div>

    <form th:action="@{/web/add-log}" method="post" class="add-diary-form">
        <input type="hidden" name="date" th:value="${currentDate}">
        <select name="mealType" style="flex: 0.8;">
            <option value="Сніданок" data-i18n="breakfast">Сніданок</option>
            <option value="Обід" data-i18n="lunch">Обід</option>
            <option value="Вечеря" data-i18n="dinner">Вечеря</option>
            <option value="Перекус" data-i18n="snack">Перекус</option>
        </select>
        <div class="ing-group">
            <select name="ingredientId" required>
                <option value="" disabled selected data-i18n="selectFood">-- Оберіть продукт з бази --</option>
                <option th:each="ing : ${ingredients}" th:value="${ing.ingredientId}" class="dynamic-ing-option" th:data-name="${ing.name}" th:data-cal="${ing.calories}" th:text="${ing.name + ' (' + ing.calories + ' ккал)'}"></option>
            </select>
        </div>
        <input type="number" name="grams" data-i18n-ph="gramsPh" placeholder="Грами" style="flex: 0.5;" required>
        <button type="submit" class="add-btn" data-i18n="addBtn">✔️ Записати</button>
    </form>

    <table>
        <thead>
        <tr>
            <th data-i18n="time">Прийом їжі</th>
            <th data-i18n="name">Продукт</th>
            <th data-i18n="weight">Вага (г)</th>
            <th data-i18n="cal">Ккал</th>
            <th data-i18n="shortProt">Б</th>
            <th data-i18n="shortFat">Ж</th>
            <th data-i18n="shortCarbs">В</th>
            <th style="text-align: center;" data-i18n="actions">Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="log : ${logs}">
            <td><strong th:text="${log.mealType.name}" th:data-i18n="${log.mealType.name}"></strong></td>
            <td th:text="${log.ingredient.name}"></td>
            <td th:text="${log.weight}"></td>

            <td th:text="${#numbers.formatDecimal(log.ingredient.calories * (log.weight / 100.0), 1, 1)}"></td>
            <td th:text="${#numbers.formatDecimal(log.ingredient.protein * (log.weight / 100.0), 1, 1)}"></td>
            <td th:text="${#numbers.formatDecimal(log.ingredient.fat * (log.weight / 100.0), 1, 1)}"></td>
            <td th:text="${#numbers.formatDecimal(log.ingredient.carbs * (log.weight / 100.0), 1, 1)}"></td>

            <td style="text-align: center;">
                <div style="display: inline-flex; gap: 5px;">
                    <button type="button" class="icon-btn"
                            th:data-id="${log.id}"
                            th:data-meal="${log.mealType.name}"
                            th:data-ing="${log.ingredient.ingredientId}"
                            th:data-weight="${log.weight}"
                            onclick="openEditLogModal(this)" title="Редагувати запис">✏️</button>

                    <form th:action="@{/web/delete-log}" method="post" style="margin: 0;">
                        <input type="hidden" name="id" th:value="${log.id}">
                        <input type="hidden" name="date" th:value="${currentDate}">
                        <button type="submit" class="icon-btn" style="color: var(--danger);" title="Видалити запис">❌</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="modal-overlay" id="editLogModal">
    <form th:action="@{/web/update-log}" method="post" class="modal-content">
        <input type="hidden" name="id" id="editLogId">
        <input type="hidden" name="date" th:value="${currentDate}">

        <div class="modal-header">
            <h2 data-i18n="editProd">Редагувати запис</h2>
            <button type="button" class="close-btn" onclick="closeEditLogModal()">✖</button>
        </div>

        <select name="mealType" id="editLogMealType" required style="margin-bottom: 10px;">
            <option value="Сніданок" data-i18n="breakfast">Сніданок</option>
            <option value="Обід" data-i18n="lunch">Обід</option>
            <option value="Вечеря" data-i18n="dinner">Вечеря</option>
            <option value="Перекус" data-i18n="snack">Перекус</option>
        </select>

        <div class="ing-group" style="margin-bottom: 10px;">
            <select name="ingredientId" id="editLogIngredient" required>
                <option th:each="ing : ${ingredients}" th:value="${ing.ingredientId}" class="dynamic-ing-option" th:data-name="${ing.name}" th:data-cal="${ing.calories}" th:text="${ing.name + ' (' + ing.calories + ' ккал)'}"></option>
            </select>
        </div>

        <input type="number" name="grams" id="editLogWeight" data-i18n-ph="gramsPh" placeholder="Грами" required style="margin-bottom: 15px;">

        <button type="submit" class="save-db-btn" data-i18n="updateBtn">💾 Оновити</button>
    </form>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
